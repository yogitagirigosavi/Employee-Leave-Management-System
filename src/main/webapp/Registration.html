<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>Registration</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style> 
:root {
	--primary-teal: #37B2A1;
	--text-dark: #1F403B;
	--text-light: #7A8B88;
	--bg-soft: #E0F2F1;
}

* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
	font-family: 'Poppins', sans-serif;
}

body {
	background-color: var(--bg-soft);
	display: flex;
	justify-content: center;
	align-items: center;
	min-height: 100vh;
	overflow: hidden;
}

/* Page Background Curves */
.page-wrapper::before {
	content: "";
	position: absolute;
	width: 800px;
	height: 800px;
	background: radial-gradient(circle, rgba(55, 178, 161, 0.1) 0%,
		transparent 70%);
	top: -200px;
	left: -200px;
	z-index: -1;
}

.main-card {
	background: white;
	width: 90%;
	max-width: 1000px;
	height: 650px;
	border-radius: 12px;
	box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
	position: relative;
	display: flex;
	flex-direction: column;
	overflow: hidden;
}

/* Content Area */
.content-split {
	display: flex;
	flex: 1;
}

.form-section {
	flex: 1.1;
	padding: 0 60px 40px 80px;
}

.main-title {
	color: var(--primary-teal);
	font-size: 32px;
	line-height: 1.2;
	margin-bottom: 20px;
	text-align: center;
}

/* Tabs */
.tabs {
	display: flex;
	justify-content: center;
	gap: 40px;
	margin-bottom: 25px;
	border-bottom: 2px solid #F0F0F0;
	width: fit-content;
	margin-left: auto;
	margin-right: auto;
}

.tabs span {
	padding-bottom: 10px;
	font-weight: 600;
	color: #555;
	cursor: pointer;
	transition: 0.3s;
}

.tab-login:hover, .tab-signup:hover {
	color: #00a7a0;
	border-bottom: 2px solid #00a7a0;
	transition: 0.3s;
}

/* Form Inputs */
.field-label {
	font-size: 14px;
	font-weight: 600;
	color: var(--text-dark);
	margin-bottom: 6px;
}

.input-container {
	position: relative;
	margin-bottom: 15px;
}

.input-container i {
	position: absolute;
	left: 15px;
	top: 50%;
	transform: translateY(-50%);
	color: #BDC3C7;
}

.input-container .toggle-icon {
	left: auto;
	right: 15px;
	cursor: pointer;
}

input {
	width: 100%;
	padding: 12px 15px 12px 45px;
	border: 1px solid #EAECEE;
	border-radius: 20px;
	background: #FAFBFC;
	outline: none;
	color: var(--text-dark);
}

select {
	width: 100%;
	padding: 12px 15px;
	border: 1px solid #EAECEE;
	border-radius: 20px;
	background: #FAFBFC;
	outline: none;
	color: var(--text-dark);
}

.reg-btn {
	width: 100%;
	background: var(--primary-teal);
	color: white;
	border: none;
	padding: 14px;
	border-radius: 25px;
	font-size: 16px;
	font-weight: 600;
	margin-top: 15px;
	cursor: pointer;
}

.footer-link {
	text-align: center;
	margin-top: 15px;
	font-size: 13px;
	color: var(--text-light);
}

.footer-link a {
	color: var(--primary-teal);
	text-decoration: none;
	font-weight: 600;
}

/* Visual Section (Teal Curve) */
.visual-section {
	flex: 1;
	position: relative;
	display: flex;
	justify-content: center;
	align-items: center;
}

.curve-bg {
	position: absolute;
	top: 0;
	right: 0;
	width: 100%;
	height: 100%;
	background: #64D2C1;
	clip-path: ellipse(90% 80% at 95% 50%);
	z-index: 1;
}

.hero-img {
	width: 80%;
	z-index: 2;
	position: relative;
	filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.1));

</style>

</head>
<body>
	<div class="page-wrapper">
		<div class="main-card">
			<div class="content-split">
				<div class="form-section">
					<h1 class="main-title">
						Employee Leave <br>Management System
					</h1>

					<div class="tabs">
						<span class="tab-login">Login</span> <span class="tab-signup">Sign
							up</span>
					</div>

					<form>
						<div class="field-label">Name</div>
						<div class="input-container">
							<i class="far fa-user"></i> <input type="text"
								placeholder="Enter Full Name">
						</div>

						<div class="field-label">Email</div>
						<div class="input-container">
							<i class="far fa-envelope"></i> <input type="email"
								placeholder="Enter Email Address">
						</div>

						<div class="field-label">Password</div>
						<div class="input-container">
							<i class="fas fa-lock"></i> <input type="password"
								placeholder="Enter Password"> <i
								class="far fa-eye-slash toggle-icon"></i>
						</div>

						<div class="field-label">Role</div>
						<div class="input-container">
							<select>
								<option>-- Select Role --</option>
								<option>Admin</option>
								<option>Employee</option>
							</select>
						</div>

						<button type="submit" class="reg-btn">Register</button>
					</form>
					<p class="footer-link">
						Already have an account? <a href="#">Login Here</a>
					</p>
				</div>

				<div class="visual-section">
					<div class="curve-bg"></div>
					<img
						src="https://static.vecteezy.com/system/resources/previews/035/727/353/non_2x/male-circle-date-on-calendar-planning-important-matter-time-management-and-deadline-concept-work-organization-and-life-events-notification-memo-reminder-illustration-in-flat-style-vector.jpg"
						class="hero-img">
				</div>
			</div>
		</div>
	</div>
</body>
</html>
