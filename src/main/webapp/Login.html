<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>Login Page</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    background:#dff4f2;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    position:relative;
}

/* Background Circles */

body::before{
    content:"";
    position:absolute;
    width:500px;
    height:500px;
    background:#9fd7d5;
    border-radius:50%;
    top:-150px;
    left:-150px;
    opacity:0.7;
}

body::after{
    content:"";
    position:absolute;
    width:600px;
    height:600px;
    background:#a7e5df;
    border-radius:50%;
    bottom:-250px;
    right:-250px;
    opacity:0.7;
}

/* Main Container */

.login-container{
    width:1000px;
    height:550px;
    background:white;
    border-radius:10px;
    display:flex;
    overflow:hidden;
    box-shadow:0px 10px 30px rgba(0,0,0,0.1);
    position:relative;
    z-index:10;
}

/* Left Section */

.left-section{
    width:50%;
    background:white;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px;
}

/* Form Container */

.form-container{
    width:100%;
    max-width:420px;
}

/* Login & Signup */

.form-title{
    display:flex;
    gap:40px;
    justify-content:center;
    margin-bottom:40px;
}

.form-title h4{
    cursor:pointer;
    color:#777;
    padding-bottom:5px;
    transition:0.3s;
    font-size:28px;
    font-weight:bold;
}

.form-title h4:hover{
    color:#00a7a0;
    border-bottom:2px solid #00a7a0;
}


/* Input Fields */

.input-box{
    position:relative;
    margin-bottom:25px;
}

.input-box input{
    width:100%;
    padding:12px 45px;
    border:none;
    border-radius:30px;
    background:#f5f5f5;
    outline:none;
    box-shadow:0px 2px 5px rgba(0,0,0,0.1);
}

.input-box i{
    position:absolute;
    left:18px;
    top:14px;
    color:#00a7a0;
}

/* Bottom Section */

.bottom-section{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:10px;
}

.forgot{
    font-size:13px;
    color:#555;
    text-decoration:none;
}

/* Button */

.login-btn{
    border:none;
    background:#00b3a4;
    color:white;
    padding:8px 35px;
    border-radius:30px;
    transition:0.3s;
}

.login-btn:hover{
    background:#008f84;
}

/* Right Section */

.right-section{
    width:50%;
    background:linear-gradient(135deg,#c9f2ee,#74d7cc);
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* Circles */

.circle1{
    position:absolute;
    width:500px;
    height:500px;
    border-radius:50%;
    background:rgba(255,255,255,0.2);
}

.circle2{
    position:absolute;
    width:380px;
    height:380px;
    border-radius:50%;
    background:rgba(255,255,255,0.2);
}

/* Image */

.right-section img{
    width:320px;
    z-index:2;
}

/* Responsive */

@media(max-width:900px){

    .login-container{
        width:95%;
        height:auto;
        flex-direction:column;
    }

    .left-section,
    .right-section{
        width:100%;
    }

    .right-section{
        padding:40px 0;
    }
}

</style>

</head>

<body>

<div class="login-container">

    <!-- Left Section -->

    <div class="left-section">

        <div class="form-container">

            <div class="form-title">
                <h4 class="active">Login</h4>
                <h4>Sign Up</h4>
            </div>

            <form action="login" method="post">

                <div class="input-box">
                    <i class="fa-solid fa-user"></i>

                    <input type="email"
                           name="email"
                           placeholder="Email or phone number"
                           required>
                </div>

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input type="password"
                           name="password"
                           placeholder="Password"
                           required>
                </div>

                <div class="bottom-section">

                    <a href="#" class="forgot">
                        Forgot your password?
                    </a>

                    <button type="submit" class="login-btn">
                        Login
                    </button>

                </div>

            </form>

        </div>

    </div>

    <!-- Right Section -->

    <div class="right-section">

        <div class="circle1"></div>
        <div class="circle2"></div>

        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
             alt="login image">

    </div>

</div>

</body>
</html>
